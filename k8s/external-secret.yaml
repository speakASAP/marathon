apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marathon-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: marathon-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/marathon
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/marathon
        property: DB_PASSWORD
    # Per-pair RS256 for marathon -> payments-microservice
    # (svc-marathon--payments-microservice@internal.alfares.cz).
    # Replaces static PAYMENT_API_KEY / X-API-Key outbound auth.
    - secretKey: MARATHON_TO_PAYMENTS_TOKEN
      remoteRef:
        key: secret/prod/marathon
        property: MARATHON_TO_PAYMENTS_TOKEN
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/marathon
        property: PAYMENT_APPLICATION_ID
    # Per-pair RS256 for marathon -> speakasap-portal
    # (svc-marathon--speakasap-portal@internal.alfares.cz,
    # role internal:speakasap-portal:internal). Replaces static
    # SPEAKASAP_PORTAL_LEDGER_API_KEY / SPEAKASAP_PORTAL_PAYMENT_API_KEY.
    - secretKey: MARATHON_TO_PORTAL_TOKEN
      remoteRef:
        key: secret/prod/marathon
        property: MARATHON_TO_PORTAL_TOKEN
    - secretKey: MARATHON_ADMIN_API_KEY
      remoteRef:
        key: secret/prod/marathon
        property: MARATHON_ADMIN_API_KEY

    # Per-pair RS256 for marathon -> auth-microservice
    # (svc-marathon--auth-microservice@internal.alfares.cz,
    # role internal:auth-microservice:legacy-lookup). Replaces shared
    # AUTH_INTERNAL_SERVICE_TOKEN + x-service-name.
    - secretKey: AUTH_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marathon
        property: AUTH_SERVICE_TOKEN
    - secretKey: MARATHON_PORTAL_JWT_SECRET
      remoteRef:
        key: secret/prod/marathon
        property: MARATHON_PORTAL_JWT_SECRET
    # Per-pair RS256 for marathon -> ai-microservice
    # (svc-marathon--ai-microservice@internal.alfares.cz,
    # role internal:ai-microservice:invoke). Replaces AI_SERVICE_JWT_SECRET
    # (shared HS256 mint secret from ai-microservice).
    - secretKey: MARATHON_TO_AI_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marathon
        property: MARATHON_TO_AI_SERVICE_TOKEN
    # Per-pair RS256 service token for marathon -> docs-rag (principal
    # svc-marathon--docs-rag, role internal:docs-rag-microservice:readonly, 90d).
    # Replaces the JWT_TOKEN that scripts/query-docs-rag.sh expected and that was
    # never actually mounted, so that script failed for every caller.
    - secretKey: DOCS_RAG_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marathon
        property: DOCS_RAG_SERVICE_TOKEN
    # Per-pair RS256 ingest credential for marathon -> logging-microservice
    # (svc-marathon--logging-microservice@internal.alfares.cz,
    # role internal:logging-microservice:ingest). Replaces shared
    # logging-ingest-credentials (static non-JWT).
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marathon
        property: LOGGING_SERVICE_TOKEN
