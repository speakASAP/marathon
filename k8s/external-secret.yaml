apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marathon-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: marathon-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/marathon
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/marathon
        property: DB_PASSWORD
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/marathon
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/marathon
        property: PAYMENT_APPLICATION_ID
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/marathon
        property: PAYMENT_WEBHOOK_API_KEY
    - secretKey: SPEAKASAP_PORTAL_LEDGER_API_KEY
      remoteRef:
        key: secret/prod/marathon
        property: SPEAKASAP_PORTAL_LEDGER_API_KEY
    - secretKey: MARATHON_ADMIN_API_KEY
      remoteRef:
        key: secret/prod/marathon
        property: MARATHON_ADMIN_API_KEY

    - secretKey: AUTH_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marathon
        property: AUTH_INTERNAL_SERVICE_TOKEN
    - secretKey: MARATHON_PORTAL_JWT_SECRET
      remoteRef:
        key: secret/prod/marathon
        property: MARATHON_PORTAL_JWT_SECRET
    - secretKey: AI_SERVICE_JWT_SECRET
      remoteRef:
        key: secret/prod/ai-microservice
        property: JWT_SECRET
    # Per-pair RS256 service token for marathon -> docs-rag (principal
    # svc-marathon--docs-rag, role internal:docs-rag-microservice:readonly, 90d).
    # Replaces the JWT_TOKEN that scripts/query-docs-rag.sh expected and that was
    # never actually mounted, so that script failed for every caller.
    - secretKey: DOCS_RAG_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/marathon
        property: DOCS_RAG_SERVICE_TOKEN
